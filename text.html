<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meowdding</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/text.css" />
    <script src="scripts/meow.js"></script>
  </head>

  <body>
    <div class="header">
      <a href="./..">Meowdding</a>
    </div>
    <div class="content">
      <div class="content-box">
        <div id="formatting-buttons">
          <button id="bold">B</button>
          <button id="italic">I</button>
          <button id="underline">U</button>
          <button id="strikethrough">S</button>
          <button id="obfuscated">O</button>
        </div>
        <div id="input" contenteditable="true"></div>
      </div>

      <div class="footer">
        <a href="https://github.com/meowdding/website" class="secondary"> Made with 🐈 </a>
        <p id="toggle" class="secondary">Toggle Dark Mode</p>
      </div>
    </div>
    <script src="scripts/text.ts"></script>
  </body>
</html>
